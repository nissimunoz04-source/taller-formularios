
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escuela de Fútbol Los Cerritos - Iniciar sesión</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            width: 340px;
            max-width: 85%;
            text-align: center;
        }

        h1 {
            color: #175c39;
            font-size: 24px;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background-color: #175c39;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #10452b;
        }

        .error {
            color: #c62828;
            margin-top: 15px;
        }

        .mensaje {
            color: #175c39;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>Escuela de Fútbol Los Cerritos</h1>
        <h2>Iniciar sesión</h2>

        <p class="error" th:if="${param.error}">
            Usuario o contraseña incorrectos.
        </p>

        <p class="mensaje" th:if="${param.salio}">
            Has cerrado sesión correctamente.
        </p>

        <form th:action="@{/login}" method="post">

            <label for="username">Usuario:</label>
            <input type="text"
                   id="username"
                   name="username"
                   required>

            <label for="password">Contraseña:</label>
            <input type="password"
                   id="password"
                   name="password"
                   required>

            <button type="submit">Iniciar sesión</button>

        </form>

    </div>

</body>
</html>
